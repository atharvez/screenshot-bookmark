[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-bookmark"
description = "Local-first screenshot to bookmark tool with OCR and AI tagging"
authors = [
    {name = "Open Source Contributor", email = "contributor@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
version = "0.1.0"
keywords = ["screenshot", "bookmark", "ocr", "ai", "local-first", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/yourusername/screenshot-bookmark"
Documentation = "https://github.com/yourusername/screenshot-bookmark#readme"
Repository = "https://github.com/yourusername/screenshot-bookmark"
Issues = "https://github.com/yourusername/screenshot-bookmark/issues"

[project.scripts]
screenshot-bookmark = "screenshot_bookmark.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "ruff>=0.1.0",
    "mypy>=0.950",
    "pre-commit>=2.20.0",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true