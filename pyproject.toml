[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-bookmark"
description = "Local-first screenshot to bookmark tool with OCR and AI tagging"
authors = [
    {name = "Atharva Desai", email = "7atharvadesai@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
version = "0.2.0"
keywords = ["screenshot", "bookmark", "ocr", "ai", "local-first", "productivity", "browser-extension", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "google-generativeai>=0.8.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.5",
    "python-dotenv>=1.0.0",
    "watchdog>=3.0.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0",
    "ruff>=0.1.0",
    "mypy>=0.950",
    "pre-commit>=2.20.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/atharvez/screenshot-bookmark"
Documentation = "https://github.com/atharvez/screenshot-bookmark#readme"
Repository = "https://github.com/atharvez/screenshot-bookmark"
Issues = "https://github.com/atharvez/screenshot-bookmark/issues"

[project.scripts]
screenshot-bookmark = "screenshot_bookmark.cli:main"
screenshot-bookmark-server = "screenshot_bookmark.server:main"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "C90"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true