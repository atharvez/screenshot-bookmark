<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Bookmark</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../icons/icon32.png" alt="Logo" class="app-icon">
        <span class="app-title">Screenshot Bookmark</span>
      </div>
      <div class="header-actions">
        <div id="serverBadge" class="server-badge offline" title="Checking server status...">
          <span class="status-dot"></span>
          <span id="serverText">Connecting...</span>
        </div>
        <button id="settingsToggleBtn" class="icon-btn" title="Extension Settings">⚙️</button>
      </div>
    </header>

    <!-- Settings Drawer (Collapsible) -->
    <div id="settingsPanel" class="settings-panel hidden">
      <div class="settings-header">
        <h3>Backend Settings</h3>
        <button id="closeSettingsBtn" class="close-btn">&times;</button>
      </div>
      <div class="form-group">
        <label for="apiBaseInput">API Server URL:</label>
        <div class="input-with-button">
          <input type="text" id="apiBaseInput" placeholder="http://localhost:8000">
          <button id="saveSettingsBtn" class="btn btn-sm btn-primary">Save</button>
        </div>
      </div>
      <div class="settings-links">
        <a id="openWebUiLink" href="http://localhost:8000" target="_blank" class="link-btn">
          <span>🌐 Open Web Dashboard</span>
        </a>
      </div>
    </div>

    <!-- Status Alert Banner -->
    <div id="statusBanner" class="status-banner hidden"></div>

    <!-- Active Tab Action Card -->
    <section class="current-tab-card">
      <div class="tab-header">
        <img id="currentFavicon" class="tab-favicon" src="../icons/icon16.png" alt="">
        <div class="tab-info">
          <h2 id="currentTitle" class="tab-title">Loading current page...</h2>
          <span id="currentUrl" class="tab-url">...</span>
        </div>
        <span id="bookmarkedBadge" class="badge-star hidden" title="Already Bookmarked">★ Saved</span>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="quickBookmarkBtn" class="btn btn-star" title="Save URL & title instantly (Ctrl+Shift+B)">
          <span class="btn-icon">⭐</span>
          <span class="btn-label">Quick Save</span>
        </button>
        <button id="captureTabBtn" class="btn btn-primary" title="Capture entire visible tab with OCR & AI (Ctrl+Shift+S)">
          <span class="btn-icon">📸</span>
          <span class="btn-label">Screenshot Tab</span>
        </button>
        <button id="captureAreaBtn" class="btn btn-secondary" title="Select custom area on page (Ctrl+Shift+A)">
          <span class="btn-icon">✂️</span>
          <span class="btn-label">Area</span>
        </button>
      </div>

      <!-- Expandable Metadata Options -->
      <details class="metadata-details">
        <summary class="details-summary">Add tags or notes</summary>
        <div class="metadata-fields">
          <div class="form-group">
            <input type="text" id="tagsInput" placeholder="Tags (e.g. dev, article, tools)">
          </div>
          <div class="form-group">
            <textarea id="notesInput" rows="2" placeholder="Personal notes or description..."></textarea>
          </div>
        </div>
      </details>
    </section>

    <!-- Search & Filter Section -->
    <section class="search-section">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search title, URL, OCR text, tags...">
        <button id="clearSearchBtn" class="clear-btn hidden">&times;</button>
      </div>
      <div id="tagPillsContainer" class="tag-pills-bar"></div>
    </section>

    <!-- Recent Bookmarks List -->
    <section class="bookmarks-section">
      <div class="section-header">
        <h3 id="sectionTitle">Recent Bookmarks</h3>
        <span id="bookmarkCount" class="count-pill">0</span>
      </div>
      <div id="bookmarksList" class="bookmarks-list">
        <div class="loading-state">Loading your bookmarks...</div>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
